apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }
  namespace = "io.ice.wallet"
  compileSdk = rootProject.ext.compileSdkVersion
  // Source compatibility moved here from the (no-longer-applied) generated
  // capacitor.build.gradle.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
      // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
      // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
      ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  signingConfigs {
    named("debug") {
      storeFile = rootProject.file(
        project.findProperty("DEBUG_STORE_FILE") as String
      )
      storePassword = project.findProperty("DEBUG_STORE_PASSWORD") as String
      keyAlias = project.findProperty("DEBUG_KEY_ALIAS") as String
      keyPassword = project.findProperty("DEBUG_KEY_PASSWORD") as String
    }
  }

  // `cap sync` writes the web bundle and generated resources into src/main/,
  // alongside res-shared/ which holds the static ones checked into the repo.
  sourceSets {
    main {
      res.srcDirs = ['src/main/res-shared', 'src/main/res']
      assets.srcDirs = ['src/main/assets']
    }
  }

  flavorDimensions "brand", "env"
  productFlavors {
    ionwallet {
      dimension "brand"
      applicationId "io.ice.wallet"
      getIsDefault().set(true)
    }
    prod {
      dimension "env"
    }
    beta {
      dimension "env"
      applicationIdSuffix ".beta"
      versionNameSuffix ".beta"
    }
  }

  variantFilter { variant ->
    def flavors = variant.flavors*.name
    def buildType = variant.buildType.name
    if (flavors.contains("beta") && buildType == "debug") {
      variant.ignore = true
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix = ".debug"
      versionNameSuffix = ".debug"

      firebaseCrashlytics {
        mappingFileUploadEnabled false
      }
    }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // signingConfig signingConfigs.debug
    }
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation "androidx.webkit:webkit:$androidxWebkitVersion"
  // FilesystemPlugin uses Dispatchers.Main during teardown and needs the Android dispatcher at runtime.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
  testImplementation "junit:junit:$junitVersion"
  testImplementation libs.kotlin.reflect
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  implementation platform('com.google.firebase:firebase-bom:33.5.1')
  implementation 'com.google.firebase:firebase-messaging'

  // The generated capacitor.build.gradle (rewritten by `cap sync`) is deliberately
  // not applied - it is listed here instead, so a plugin added to or dropped from
  // `capacitor.config.ts` has to be mirrored below.
  implementation project(':capacitor-android')
  implementation project(':capacitor-cordova-android-plugins')
  implementation project(':capacitor-mlkit-barcode-scanning')
  implementation project(':capacitor-app')
  implementation project(':capacitor-app-launcher')
  implementation project(':capacitor-clipboard')
  implementation project(':capacitor-dialog')
  implementation project(':capacitor-filesystem')
  implementation project(':capacitor-haptics')
  implementation project(':capacitor-keyboard')
  implementation project(':capacitor-push-notifications')
  implementation project(':capacitor-share')
  implementation project(':capacitor-status-bar')
  implementation project(':capgo-capacitor-native-biometric')
  implementation project(':capgo-native-audio')
  implementation project(':mauricewegner-capacitor-navigation-bar')
  implementation project(':capacitor-native-settings')
  implementation project(':capacitor-plugin-safe-area')
  implementation project(':capacitor-secure-storage-plugin')
}

// Cordova ext-vars script (`cdvMinSdkVersion`, `cordovaConfig`, …) is required
// by the `:capacitor-cordova-android-plugins` Gradle module's evaluation.
apply from: '../capacitor-cordova-android-plugins/cordova.variables.gradle'
